{% extends "base.html" %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}

{% if error %}
<p>{{error}}</p>
{% endif %}

<h1>Reset Password</h1>

<form method="POST">
    {% csrf_token %}

    <input type="email" name="email" placeholder="Enter your email" required>

    <button type="submit">Send Token</button>
    <h3>Didn't get the Email?</h3>
    <button type="submit" formaction="{% url 'resend_reset_email' %}"class="auth-button" style="margin-top: 10px;">Resend Reset Email</button>
</form>

{% endblock %}

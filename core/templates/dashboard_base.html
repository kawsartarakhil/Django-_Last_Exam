{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Diet Sync Dashboard{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>

    <div class="dashboard-container">

        <aside class="sidebar">

            <div class="sidebar-logo">
                <h2>Diet Sync</h2>
            </div>
            <button class="sidebar-close" id="sidebarClose" type="button">
                &times;
            </button>

            <nav class="sidebar-nav">

                <a href="{% url 'dashboard' %}">Overview</a>

                <a href="{% url 'meal_suggestions' %}">Meal Suggestions</a>

                <a href="{% url 'recipes' %}">Recipes</a>

                <a href="{% url 'favorites' %}"> &#9825; Favorites</a>

                <a href="{% url 'grocery_list' %}">Grocery List</a> 

                <a href="{% url 'profile' %}">My Profile</a> 

                <a href="{% url 'home' %}">Home</a> 
            </nav>

            <div class="sidebar-bottom">
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            </div>

        </aside>
        <button class="sidebar-overlay" id="sidebarOverlay" type="button" aria-label="Close menu"></button>

        <main class="dashboard-main">

            <header class="dashboard-header">

    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <h2>{% block page_heading %}Dashboard{% endblock %}</h2>

</header>

            <section class="dashboard-content">
                {% block content %}
                {% endblock %}
            </section>

        </main>

    </div>
<script>
    const sidebarToggle = document.getElementById("sidebarToggle");
    const sidebar = document.querySelector(".sidebar");
    const sidebarClose = document.getElementById("sidebarClose");
    const sidebarOverlay = document.getElementById("sidebarOverlay");

    function openSidebar() {
        sidebar.classList.add("active");
        sidebarOverlay.classList.add("active");
    }

    function closeSidebar() {
        sidebar.classList.remove("active");
        sidebarOverlay.classList.remove("active");
    }

    sidebarToggle.addEventListener("click", openSidebar);
    sidebarClose.addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    document.querySelectorAll(".sidebar-nav a").forEach(function(link) {
        link.addEventListener("click", closeSidebar);
    });

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            closeSidebar();
        }
    });
</script>
</body>
</html>
